[project]
name = "dirigera-disco"
version = "1.0.0"
description = "Drive IKEA Dirigera color lights in groups, hue ranges, and patterns."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dirigera>=1.6.1",
    "numpy>=2.5.4",
    "pygame>=2.6.1",
    "python-dotenv>=1.2.4",
    "sounddevice>=0.5.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dirigera_disco"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
